# Docker images for each release: <owner>/ming-voice:cuda and :rocm (also tagged with the version) on Docker Hub
# and ghcr.io. Docker Hub needs a DOCKERHUB_TOKEN secret (an access token with write access); without one, only
# ghcr.io gets them.
name: Docker images
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gpu: nvidia, flavor: cuda }
          - { gpu: amd, flavor: rocm }
    steps:
      # The ROCm image is ~20 GB unpacked: make room on the runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          imgs=(ghcr.io/$owner/ming-voice)
          hub=${DOCKERHUB_USERNAME:-$owner}
          [ -n "$DOCKERHUB_TOKEN" ] && imgs+=(docker.io/${hub,,}/ming-voice)
          ver=${GITHUB_REF_NAME#v}
          tags=
          for img in "${imgs[@]}"; do
            tags=$tags,$img:${{ matrix.flavor }}
            [ "${{ github.event_name }}" = release ] && tags=$tags,$img:$ver-${{ matrix.flavor }}
          done
          echo "tags=${tags#,}" >>"$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GPU=${{ matrix.gpu }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
