# Docker images for each release: ghcr.io/<owner>/ming-voice:cuda and :rocm (also tagged with the version)
name: Docker images
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gpu: nvidia, flavor: cuda }
          - { gpu: amd, flavor: rocm }
    steps:
      # The ROCm image is ~20 GB unpacked: make room on the runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ming-voice
          tags=$img:${{ matrix.flavor }}
          ver=${GITHUB_REF_NAME#v}
          [ "${{ github.event_name }}" = release ] && tags=$tags,$img:$ver-${{ matrix.flavor }}
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GPU=${{ matrix.gpu }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
